name: Build RideCom (Android APK & iOS Unsigned IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses (for NDK/CMake)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RideCom-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Unsigned IPA (SideStore)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned .app for iOS Device
        run: |
          xcodebuild \
            -project RideCom.xcodeproj \
            -scheme RideCom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned .ipa for SideStore
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/RideCom.app build/ipa/Payload/
          cd build/ipa
          zip -r ../RideCom-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RideCom-iOS-Unsigned-IPA
          path: ios/build/RideCom-unsigned.ipa
          if-no-files-found: error

  build-pc:
    name: Build Windows PC Tester (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File RideComPC.exe
        run: dotnet publish RideComPC.csproj -c Release -o publish

      - name: Upload Windows PC Executable
        uses: actions/upload-artifact@v4
        with:
          name: RideCom-Windows-PC
          path: pc/publish/RideComPC.exe
          if-no-files-found: error
